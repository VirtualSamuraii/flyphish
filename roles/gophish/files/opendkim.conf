UserID                  opendkim:opendkim
Syslog                  yes
#SyslogSuccess          yes
#LogWhy                 yes
UMask                   007
Mode                    sv
OversignHeaders         From
#DisableADSP             true
Socket                  inet:8891@[127.0.0.1]
PidFile                 /var/run/opendkim/opendkim.pid
RemoveOldSignatures     yes

# Lists the IP addresses of the internal SMTP servers for which OpenDKIM will sign emails
InternalHosts           refile:/etc/opendkim/hosts_whitelist
ExternalIgnoreList      refile:/etc/opendkim/hosts_whitelist

# Clé privée générée par Ansible et conservée entre les déploiements
KeyFile                 /etc/opendkim/keys/mail.private
# Used in the DNS record used to retrieve the public key ($selector._domainkey.$domain) -> here (mail._domainkey.example.com)
Selector                mail
# Sender domain (sender_domain) for which OpenDKIM will sign emails
Domain                  file:/etc/opendkim/domains_whitelist
